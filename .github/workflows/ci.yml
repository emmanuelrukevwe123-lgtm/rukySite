name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The deploy job compares this file with what the live site serves.
      - name: Stamp the build with its commit
        run: echo "$GITHUB_SHA" > out/version.txt

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7

  deploy:
    name: Deploy to the server
    needs: build
    # Only for pushes to main, and only once the server exists:
    # set the repository variable DEPLOY_ENABLED to "true" to switch it on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once; let a running one finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SITE_URL: ${{ vars.SITE_URL }}
      APP_DIR: /var/www/rukysite
      KEEP_RELEASES: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the runner refuses to connect to anything else.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload the release
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          rsync -az --delete out/ "server:$APP_DIR/releases/$release/"

      - name: Switch the live site to the new release
        run: |
          # mv -T replaces the symlink in one step, so visitors never see a half-copied site.
          ssh server "set -e
            cd '$APP_DIR'
            ln -s 'releases/$RELEASE' current.new
            mv -T current.new current
            ls -1d releases/*/ | head -n -$KEEP_RELEASES | xargs -r rm -rf --"

      - name: Check the live site serves this commit
        run: |
          for attempt in 1 2 3 4 5; do
            live="$(curl -fsS --max-time 10 "$SITE_URL/version.txt?c=$GITHUB_SHA" || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live site is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live site serves '$live', expected $GITHUB_SHA"
          exit 1
